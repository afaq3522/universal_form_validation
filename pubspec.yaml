  and Dart apps.
version: 1.0.0
homepage: https://github.com/afaq35202/universal_form_validation
repository: https://github.com/afaq35202/universal_form_validation
issue_tracker: https://github.com/afaq35202/universal_form_validation/issues
documentation: https://github.com/afaq35202/universal_form_validation#readme

environment:
  sdk: ^3.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - form
  - validation
  - validator
  - form-validation
  - input
